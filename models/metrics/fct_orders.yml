version: 2

models:
  - name: fct_orders
    description: One row per order with the customer key, order date, and collected payment amount.
  
    semantic_model:
      enabled: true
  

    columns:
      - name: order_id
        description: Primary key for the order fact.
        data_tests:
          - not_null
          - unique
        entity:
          name: order
          type: primary

      - name: customer_id
        description: Customer associated with the order.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
        entity:
          name: customer
          type: foreign

      - name: order_date
        description: Date the order was placed.
        data_tests:
          - not_null
        granularity: day
        dimension:
          type: time

      - name: amount
        description: Total payment amount for the order. Defaults to 0 if no successful payment exists.
        data_tests:
          - not_null

    metrics:
      - name: num_orders
        type: simple
        description: Total number of orders.
        label: Order Count
        agg: count
        expr: 1
        agg_time_dimension: order_date

      - name: order_revenue
        type: simple
        description: Total payment amount collected across orders.
        label: Order Revenue
        agg: sum
        expr: amount
        agg_time_dimension: order_date

      - name: average_order_value
        type: simple
        description: Average payment amount per order.
        label: Average Order Value
        agg: average
        expr: amount
        agg_time_dimension: order_date
