version: 2

models:
  - name: dim_customers
    description: One row per customer with customer profile attributes and lifetime order value rollups.
    config:
      access: public
      contract:
        enforced: true
    time_spine:
      standard_granularity_column: first_order_date
    semantic_model:
      enabled: true

    agg_time_dimension: first_order_date


    columns:
      - name: customer_id
        description: Primary key for the customer dimension.
        data_type: int
        constraints:
          - type: not_null
        data_tests:
          - not_null
          - unique
        entity:
          name: customer
          type: primary

      - name: first_name
        description: Customer first name.
        data_type: varchar
        dimension:
          type: categorical

      - name: last_name
        description: Customer last name.
        data_type: varchar
        dimension:
          type: categorical

      - name: first_order_date
        description: Date of the customer's first order.
        data_type: date
        granularity: day
        dimension:
          type: time

      - name: most_recent_order_date
        description: Date of the customer's most recent order.
        data_type: date
        granularity: day
        dimension:
          type: time

      - name: number_of_orders
        description: Total number of orders placed by the customer.
        data_type: number(18,0)

      - name: lifetime_value
        description: Total lifetime revenue attributed to the customer.
        data_type: number(38,6)

      # DBT-19: new column exposing average monthly orders
      - name: average_monthly_orders
        description: Average number of orders placed per month over the customer's active span (first order date through most recent order date, inclusive).
        data_type: number(38,6)

    metrics:
      - name: order_count
        type: simple
        description: Total number of orders.
        agg: sum
        expr: number_of_orders

      - name: lifetime_revenue
        type: simple
        description: Total lifetime revenue attributed to this customer
        agg: sum
        expr: lifetime_value

      # DBT-19: new metric/measure over the average_monthly_orders column
      - name: avg_monthly_orders
        type: simple
        description: Average of each customer's average monthly order rate.
        label: Average Monthly Orders
        agg: average
        expr: average_monthly_orders
