version: 2

models:
  - name: dim_customers
    description: One row per customer with customer profile attributes and lifetime order value rollups.
    config:
      access: public
      contract:
        enforced: true
    semantic_model:
      enabled: true
    agg_time_dimension: first_order_date

    columns:
      - name: customer_id
        description: Primary key for the customer dimension.
        data_type: int
        constraints:
          - type: not_null
        data_tests:
          - not_null
          - unique
        entity:
          name: customer
          type: primary

      - name: first_name
        description: Customer first name.
        data_type: varchar
        dimension:
          type: categorical

      - name: last_name
        description: Customer last name.
        data_type: varchar
        dimension:
          type: categorical

      - name: first_order_date
        description: Date of the customer's first order.
        data_type: date
        granularity: day
        dimension:
          type: time

      - name: most_recent_order_date
        description: Date of the customer's most recent order.
        data_type: date
        granularity: day
        dimension:
          type: time

      - name: number_of_orders
        description: Total number of orders placed by the customer.
        data_type: number(18,0)

      - name: max_number_of_orders
        description: Maximum number of orders for the customer. At customer grain, this equals number_of_orders.
        data_type: number(18,0)

      - name: lifetime_value
        description: Total lifetime revenue attributed to the customer.
        data_type: number(38,6)

    metrics:
      - name: order_count
        type: simple
        description: Total number of orders.
        label: Customer Order Count

        agg: sum
        expr: number_of_orders

      - name: lifetime_revenue
        type: simple
        description: Total lifetime revenue attributed to this customer
        label: Lifetime Revenue
        agg: sum
        expr: lifetime_value


unit_tests:
  - name: test_dim_customers_aggregates_order_rollups
    model: dim_customers
    given:
      - input: ref('stg_jaffle_shop__customers')
        rows:
          - {customer_id: 1, first_name: Jill, last_name: Johnson}
      - input: ref('fct_orders')
        rows:
          - {customer_id: 1, order_id: 101, order_date: 2024-01-03, amount: 12.5}
          - {customer_id: 1, order_id: 102, order_date: 2024-02-10, amount: 7.5}
          - {customer_id: 1, order_id: 103, order_date: 2024-01-20, amount: 10}
    expect:
      rows:
        - {customer_id: 1, first_name: Jill, last_name: Johnson, first_order_date: 2024-01-03, most_recent_order_date: 2024-02-10, number_of_orders: 3, max_number_of_orders: 3, lifetime_value: 30}

  - name: test_dim_customers_keeps_customers_without_orders
    model: dim_customers
    given:
      - input: ref('stg_jaffle_shop__customers')
        rows:
          - {customer_id: 2, first_name: Alex, last_name: Smith}
      - input: ref('fct_orders')
        rows: []
    expect:
      rows:
        - {customer_id: 2, first_name: Alex, last_name: Smith, first_order_date: null, most_recent_order_date: null, number_of_orders: 0, max_number_of_orders: 0, lifetime_value: null}
