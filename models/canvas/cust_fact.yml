# KAN-13: semantic model and cf_* metrics exposing all measures from cust_fact
version: 2

models:
  - name: cust_fact
    description: Order-grain fact joining dim_customers with fct_orders for cross-cutting customer × order analytics.

    semantic_model:
      enabled: true

    columns:
      - name: order_id
        description: Identifier for the order row in cust_fact.
        entity:
          name: cust_fact_order
          type: primary

      - name: customer_id
        description: Customer associated with the order.
        entity:
          name: customer
          type: foreign

      - name: order_date
        description: Date the order was placed.
        granularity: day
        dimension:
          type: time

      - name: first_order_date
        description: Date of the customer's first order.
        granularity: day
        dimension:
          type: time

      - name: most_recent_order_date
        description: Date of the customer's most recent order.
        granularity: day
        dimension:
          type: time

      - name: first_name
        description: Customer first name.
        dimension:
          type: categorical

      - name: last_name
        description: Customer last name.
        dimension:
          type: categorical

      - name: amount
        description: Payment amount for the order.

      - name: number_of_orders
        description: Total number of orders placed by the customer (denormalized from dim_customers).

      - name: lifetime_value
        description: Total lifetime revenue for the customer (denormalized from dim_customers).

      - name: avg_monthly_orders
        description: Average monthly orders for the customer (denormalized from dim_customers).

    metrics:
      # KAN-13: cf_* metrics expose every measure from cust_fact; cf_ prefix avoids name collisions with fct_orders / dim_customers metrics
      - name: cf_order_count
        type: simple
        description: Count of orders in cust_fact.
        label: cf Order Count
        agg: count
        expr: order_id
        agg_time_dimension: order_date

      - name: cf_total_amount
        type: simple
        description: Sum of order amounts in cust_fact.
        label: cf Total Amount
        agg: sum
        expr: amount
        agg_time_dimension: order_date

      - name: cf_avg_order_amount
        type: simple
        description: Average order amount in cust_fact.
        label: cf Average Order Amount
        agg: average
        expr: amount
        agg_time_dimension: order_date

      - name: cf_total_number_of_orders
        type: simple
        description: "Sum of number_of_orders across cust_fact rows (note: inflated by orders-per-customer fan-out)."
        label: cf Total Number of Orders
        agg: sum
        expr: number_of_orders
        agg_time_dimension: order_date

      - name: cf_total_lifetime_value
        type: simple
        description: "Sum of lifetime_value across cust_fact rows (note: inflated by orders-per-customer fan-out)."
        label: cf Total Lifetime Value
        agg: sum
        expr: lifetime_value
        agg_time_dimension: order_date

      - name: cf_avg_monthly_orders
        type: simple
        description: Average of avg_monthly_orders across cust_fact rows.
        label: cf Average Monthly Orders
        agg: average
        expr: avg_monthly_orders
        agg_time_dimension: order_date
