sources:
  - name: jaffle_shop
    database: pb_raw
    schema: jaffle_shop
    config:
      freshness:
        warn_after:
          count: 12
          period: hour
        error_after:
          count: 3
          period: day
      loaded_at_field: _etl_loaded_at
    tables:
      - name: customers
        columns:
          - name: id
            data_tests:
              - unique
              - not_null
        config:
          freshness:
            null
      - name: orders
        columns:
          - name: id
            data_tests:
              - unique
              - not_null
              
        