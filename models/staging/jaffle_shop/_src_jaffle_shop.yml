sources:
  - name: jaffle_shop
    database: pb_raw
    schema: jaffle_shop
    description: A clone of a Postgres application database
    tables:
      - name: customers
        description: Raw customer source data
        columns:
          - name: id
            description: Primary key for the customer data
            data_tests:
              - unique
              - not_null
      - name: orders
        description: Raw orders data
        columns:
          - name: id
            description:  Primary key for the order data
            data_tests:
              - unique
              - not_null
        config:
          freshness:
            warn_after:
              count: 12
              period: hour
            error_after:
              count: 365
              period: day
          loaded_at_field: _etl_loaded_at
              
        