models:
  - name: dim_customers
    semantic_model:
      enabled: true
    description: Customer dimension with customer-level order history rollups.
    agg_time_dimension: first_order_date
    columns:
      - name: customer_id
        entity:
          type: primary
          name: customer
      - name: first_name
        dimension:
          type: categorical
      - name: last_name
        dimension:
          type: categorical
      - name: first_order_date
        dimension:
          type: time
        granularity: day
      - name: most_recent_order_date
        dimension:
          type: time
        granularity: day
    metrics:
      - name: customer_order_count
        label: Customer Order Count
        type: simple
        agg: sum
        expr: number_of_orders
      - name: customer_lifetime_value
        label: Customer Lifetime Value
        type: simple
        agg: sum
        expr: lifetime_value