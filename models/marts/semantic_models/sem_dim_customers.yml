semantic_models:
- name: dim_customers
  description: A customer dimension table containing customer details and order information.
  model: ref('dim_customers')
  defaults:
    agg_time_dimension: first_order_date
  entities:
  - name: customer_id
    type: primary
    expr: CUSTOMER_ID
  dimensions:
  - name: first_name
    expr: FIRST_NAME
    type: categorical
  - name: last_name
    expr: LAST_NAME
    type: categorical
  - name: first_order_date
    expr: FIRST_ORDER_DATE
    type: time
    type_params:
      time_granularity: day
  - name: most_recent_order_date
    expr: MOST_RECENT_ORDER_DATE
    type: time
    type_params:
      time_granularity: day
  measures:
  - name: number_of_orders
    description: The total number of orders placed by the selected customer population.
    agg: sum
    create_metric: false
    expr: NUMBER_OF_ORDERS
  - name: lifetime_value
    description: The total lifetime value of the selected customer population.
    agg: sum
    create_metric: false
    expr: LIFETIME_VALUE
  - name: customer_count
    description: The distinct number of customers in the selected population.
    agg: count_distinct
    create_metric: false
    expr: CUSTOMER_ID
  - name: customers_with_orders
    description: Customers who have placed at least one order.
    agg: count_distinct
    create_metric: false
    expr: CASE WHEN NUMBER_OF_ORDERS > 0 THEN CUSTOMER_ID END
  - name: repeat_customers
    description: Customers who have placed more than one order.
    agg: count_distinct
    create_metric: false
    expr: CASE WHEN NUMBER_OF_ORDERS > 1 THEN CUSTOMER_ID END

metrics:
- name: customer_count
  description: Count of customers in the selected slice.
  label: Customer Count
  type: simple
  type_params:
    measure: customer_count

- name: customers_with_orders
  description: Count of customers who have placed at least one order.
  label: Customers with Orders
  type: simple
  type_params:
    measure: customers_with_orders

- name: repeat_customers
  description: Count of customers who have placed more than one order.
  label: Repeat Customers
  type: simple
  type_params:
    measure: repeat_customers

- name: total_orders
  description: Total orders placed by the selected customer population.
  label: Total Orders
  type: simple
  type_params:
    measure: number_of_orders

- name: total_customer_lifetime_value
  description: Total lifetime value across the selected customer population.
  label: Total Customer Lifetime Value
  type: simple
  type_params:
    measure: lifetime_value

- name: avg_orders_per_customer
  description: Average number of orders per customer.
  label: Avg Orders per Customer
  type: ratio
  type_params:
    numerator: total_orders
    denominator: customer_count

- name: avg_customer_lifetime_value
  description: Average lifetime value per customer.
  label: Avg Customer Lifetime Value
  type: ratio
  type_params:
    numerator: total_customer_lifetime_value
    denominator: customer_count

- name: repeat_customer_rate
  description: Share of ordering customers who have placed more than one order.
  label: Repeat Customer Rate
  type: ratio
  type_params:
    numerator: repeat_customers
    denominator: customers_with_orders
