version: 2

models:
  - name: fct_orders
    columns:
      - name: order_id
        description: Primary key for the orders fact table.
        data_tests:
          - not_null
          - unique

      - name: customer_id
        description: Foreign key to dim_customers.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id

      - name: order_date
        description: Date the order was placed.
        data_tests:
          - not_null

      - name: amount
        description: Total payment amount for the order. Defaults to 0 if no successful payment exists.
        data_tests:
          - not_null
